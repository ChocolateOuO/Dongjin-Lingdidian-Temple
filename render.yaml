# Render Blueprint — 東津代天府靈帝殿 官方網站（Eleventy 靜態站）
# 若既有 Render 服務不是以 Blueprint 建立，請改在 Dashboard 手動設定：
#   Build Command:    npm ci && npx @11ty/eleventy
#   Publish Directory: _site
services:
  - type: web
    name: dongjin-lingdidian-temple
    runtime: static
    buildCommand: npm ci && npx @11ty/eleventy
    staticPublishPath: _site
    pullRequestPreviewsEnabled: true
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
